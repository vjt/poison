{{ if not .Params.noComments }}
<div id="comments" class="comments">
    {{ if .Site.Params.remark42 }}
        <div id="remark42"></div>
        <script>
            var savedTheme = localStorage.getItem("theme");
            var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            var currentTheme = savedTheme ? savedTheme : (systemDark ? "dark" : "light");

            // Use English URL as canonical thread so comments are shared across languages
            // remark42_url overrides baseURL so staging can point to prod threads
            var canonicalUrl = {{ (site.Params.remark42_url | default (.Site.BaseURL | strings.TrimSuffix "/")) }} + {{ .RelPermalink }};
            {{ if eq .Language.Lang "it" }}
            canonicalUrl = canonicalUrl.replace(/\/it\//, '/');
            {{ end }}

            var remark_config = {
                host: {{ site.Params.remark42_host }},
                site_id: {{ site.Params.remark42_site_id }},
                url: canonicalUrl,
                theme: currentTheme,
                max_shown_comments: 100,
            }
        </script>
        <script>
            (function() {
                var loaded = false;
                function loadRemark42() {
                    if (loaded) return;
                    loaded = true;
                    var components = remark_config.components || ["embed"];
                    for (var i = 0; i < components.length; i++) {
                        var s = document.createElement("script");
                        var ext = ".js";
                        var parent = document.head || document.body;
                        if ("noModule" in s) { s.type = "module"; ext = ".mjs"; }
                        else { s.async = true; s.defer = true; }
                        s.src = remark_config.host + "/web/" + components[i] + ext;
                        parent.appendChild(s);
                    }
                }
                var target = document.getElementById('remark42');
                if ('IntersectionObserver' in window && target) {
                    var io = new IntersectionObserver(function(entries) {
                        for (var j = 0; j < entries.length; j++) {
                            if (entries[j].isIntersecting) {
                                loadRemark42();
                                io.disconnect();
                                return;
                            }
                        }
                    }, { rootMargin: '150px' });
                    io.observe(target);
                } else {
                    loadRemark42();
                }
            })();
        </script>
    {{ else if site.Config.Services.Disqus.Shortname }}
        {{ template "_internal/disqus.html" . }}
    {{ end }}
</div>
{{ end }}
