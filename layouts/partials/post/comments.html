{{ if not .Params.noComments }}
<div id="comments" class="comments">
    {{ if .Site.Params.remark42 }}
        <div id="remark42"></div>
        <script>
            var savedTheme = localStorage.getItem("theme");
            var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            var currentTheme = savedTheme ? savedTheme : (systemDark ? "dark" : "light");

            // Use English URL as canonical thread so comments are shared across languages
            // remark42_url overrides baseURL so staging can point to prod threads
            var canonicalUrl = {{ (site.Params.remark42_url | default (.Site.BaseURL | strings.TrimSuffix "/")) }} + {{ .RelPermalink }};
            {{ if eq .Language.Lang "it" }}
            canonicalUrl = canonicalUrl.replace(/\/it\//, '/');
            {{ end }}

            var remark_config = {
                host: {{ site.Params.remark42_host }},
                site_id: {{ site.Params.remark42_site_id }},
                url: canonicalUrl,
                theme: currentTheme,
                max_shown_comments: 100,
            }
        </script>
        <script>!function(e,n){for(var o=0;o<e.length;o++){var r=n.createElement("script"),c=".js",d=n.head||n.body;"noModule"in r?(r.type="module",c=".mjs"):r.async=!0,r.defer=!0,r.src=remark_config.host+"/web/"+e[o]+c,d.appendChild(r)}}(remark_config.components||["embed"],document);</script>
    {{ else if .Site.DisqusShortname }}
        {{ template "_internal/disqus.html" . }}
    {{ end }}
</div>
{{ end }}
