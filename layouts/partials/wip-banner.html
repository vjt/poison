{{- if .Site.Params.staging }}
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap">
<div class="wip-banner">
  <style>
    .wip-banner {
      background: #ffff00;
      background-image: repeating-linear-gradient(
        -45deg,
        transparent,
        transparent 10px,
        #000 10px,
        #000 20px
      );
      padding: 4px 0;
      position: relative;
      z-index: 9999;
    }
    .wip-banner-inner {
      background: #ffff00;
      text-align: center;
      padding: 6px 1rem;
      font-family: "Comic Sans MS", "Comic Neue", "Comic Sans", cursive;
      font-size: 14px;
      color: #000;
    }
    .wip-banner-inner a {
      color: #0000ff;
      font-weight: bold;
    }
    .wip-banner-inner a:visited {
      color: #800080;
    }
    .wip-blink {
      animation: wip-blink-anim 1s steps(1) infinite;
      font-weight: bold;
      color: #ff0000;
    }
    @keyframes wip-blink-anim {
      50% { opacity: 0; }
    }
  </style>
  <div class="wip-banner-inner">
    &#x1F6A7; <span class="wip-blink">UNDER CONSTRUCTION</span> &#x1F6A7;
    This is a staging site.
    {{- with .Site.Params.produrl }}
    Visit the real thing at <a href="{{ . }}">{{ . | replaceRE "^https?://" "" | strings.TrimRight "/" }}</a>
    {{- end }}
  </div>
</div>
{{- end }}
