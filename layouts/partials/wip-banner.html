{{- if .Site.Params.staging }}
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap">
<div class="wip-banner">
  <style>
    .wip-banner {
      background: #ffff00;
      background-image: repeating-linear-gradient(
        -45deg,
        transparent,
        transparent 10px,
        #000 10px,
        #000 20px
      );
      padding: 4px 0;
      position: relative;
      z-index: 9999;
      overflow: hidden;
    }
    .wip-banner-inner {
      background: #ffff00;
      padding: 6px 1rem;
      font-family: "Comic Sans MS", "Comic Neue", "Comic Sans", cursive;
      font-size: 14px;
      color: #000;
      white-space: nowrap;
      overflow: hidden;
    }
    .wip-marquee {
      display: inline-block;
      animation: wip-scroll 8s linear forwards;
    }
    @keyframes wip-scroll {
      0%   { transform: translateX(100vw); }
      100% { transform: translateX(0); }
    }
    .wip-banner-inner a {
      color: #0000ff;
      font-weight: bold;
    }
    .wip-banner-inner a:visited {
      color: #800080;
    }
    .wip-blink {
      animation: wip-blink-anim 1s steps(1) infinite;
      font-weight: bold;
      color: #ff0000;
    }
    @keyframes wip-blink-anim {
      50% { opacity: 0; }
    }
  </style>
  <div class="wip-banner-inner">
    <span class="wip-marquee">
      &#x1F6A7; <span class="wip-blink">UNDER CONSTRUCTION</span> &#x1F6A7;
      This is a staging site &mdash;
      {{- with .Site.Params.produrl }}
      visit the real thing at <a href="{{ . }}">{{ . | replaceRE "^https?://" "" | strings.TrimRight "/" }}</a>
      {{- end }}
    </span>
  </div>
  <script>
    document.querySelector('.wip-marquee').addEventListener('animationend', function() {
      this.style.animation = 'none';
      this.style.transform = 'none';
      this.parentElement.style.whiteSpace = 'normal';
      this.parentElement.style.overflow = 'visible';
    });
  </script>
</div>
{{- end }}
