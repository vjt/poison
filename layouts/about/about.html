{{ define "main" -}}
<div class="about">
    {{ with .Site.GetPage "/about" -}}
    {{ partial "featured-image.html" . }}
    <img src="/vjt.jpg" alt="Marcello Barnaba" class="about-photo">
    {{ if .Pages }}
        {{ range .Pages }}
            <h1 data-pagefind-meta="title">{{ .Title }}</h1>
            {{ .Content }}
        {{ end }}
    {{ else }}
        <h1 data-pagefind-meta="title">{{ .Title }}</h1>
        {{ .Content }}
    {{ end }}
    {{- end }}
</div>
{{ end }}
