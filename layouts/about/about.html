{{ define "main" -}}
<div class="resume">
    <img src="/vjt.jpg" alt="Marcello Barnaba" class="resume-photo">
    {{ with .Site.GetPage "/about" }}
        {{ if .Pages }}
            {{ range .Pages }}
                <h1 data-pagefind-meta="title">{{ .Title }}</h1>
                {{ .Content }}
            {{ end }}
        {{ else }}
            <h1 data-pagefind-meta="title">{{ .Title }}</h1>
            {{ .Content }}
        {{ end }}
    {{ end }}
</div>
{{ end }}
