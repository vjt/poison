{{ define "main" -}}
<div class="about">
    {{ with .Site.GetPage "/about" -}}
    {{ partial "featured-image.html" . }}
    {{ with $.Site.Params.brand_image }}<img src="{{ . }}" alt="{{ $.Site.Title }}" class="about-photo">{{ end }}
    {{ if .Pages }}
        {{ range .Pages }}
            <h1 data-pagefind-meta="title">{{ .Title }}</h1>
            {{ .Content }}
        {{ end }}
    {{ else }}
        <h1 data-pagefind-meta="title">{{ .Title }}</h1>
        {{ .Content }}
    {{ end }}
    {{- end }}
</div>
{{ end }}
