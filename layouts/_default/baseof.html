{{ partial "head/head.html" . }}
    <body class="{{ if .Site.Params.dark_mode }}dark-theme{{ end }}{{ if or (and (eq .Kind "page") (not .Params.hideToc) (not .Site.Params.hideToc) (findRE "<li>" .TableOfContents)) (eq .Kind "home") }} has-toc{{ end }}">
        {{ partial "boot-splash.html" . }}
        <script>if(localStorage.getItem('boot-done')&&(Date.now()-Number(localStorage.getItem('boot-done')))<86400000)document.getElementById('boot-splash').remove();</script>
        {{ partial "header.html" . }}
        <div class="sidebar-overlay"></div>
        <div class="wrapper">
            {{ partial "sidebar/sidebar.html" . }}
            <main class="content container">
                {{ block "main" . -}}{{- end }}
            </main>
            {{ block "sidebar" . }}{{ end }}
        </div>
    </body>
</html>
