name = "Sindrome"
license = "GPL-3.0 License"
licenselink = "https://github.com/vjt/hugo-sindrome-theme/blob/master/LICENSE.md"
description = "A modern, bilingual Hugo theme with CSS Grid layout, system-aware dark mode, and a boot sequence easter egg. Forked from Poison."
min_version = "0.101.0"

homepage = "https://github.com/vjt/hugo-sindrome-theme"

tags = ["blog", "personal", "dark-mode", "light", "minimal", "bilingual", "responsive", "css-grid"]
features = ["blog", "table-of-contents", "dark-mode", "series", "i18n", "hamburger-menu", "boot-splash"]

[author]
    name = "Marcello Barnaba"
    homepage = "https://sindro.me"

[original]
    author = "Luke Orth (Poison theme)"
    homepage = "https://lukeorth.com"
    repo = "https://github.com/lukeorth/poison"
